name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # Real Next.js build + real backend (tests/e2e_server.py); only external APIs are faked.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  docker:
    # The production stack exactly as deployed: real Dockerfiles, compose.yaml, Caddy with HTTPS
    # (local certificates for *.localhost), separate worker, the web profile, then deploy/smoke-test.sh.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test configuration
        run: |
          cat > .env <<'ENV'
          APP_DOMAIN=app.localhost
          API_DOMAIN=api.localhost
          ACME_EMAIL=ci@example.org
          CADDY_GLOBAL=local_certs
          CADDY_SITES=all
          COMPOSE_PROFILES=web
          ENV
      - run: docker compose build
      - run: docker compose up -d
      - run: deploy/smoke-test.sh
      - if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4   # also validates the wrapper jar
      - run: ./gradlew -p core test
      - run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: reel-check-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  android-emulator:
    # Runs the APK on an emulator against a real backend (android/ci/emulator_smoke.py); screenshots are uploaded.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reel-check-debug-apk
          path: apk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start the backend (no API keys; the emulator reaches it as 10.0.2.2:8000)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r backend/requirements.txt
          cd backend && DATA_DIR=$RUNNER_TEMP/data nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            --no-access-log > $RUNNER_TEMP/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python android/ci/emulator_smoke.py apk/app-debug.apk emulator-out ${{ runner.temp }}/backend.log
      - if: always()
        run: cp $RUNNER_TEMP/backend.log emulator-out/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: emulator-out
          retention-days: 14
