name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    # Real Next.js build + real backend (tests/e2e_server.py); only external APIs are faked.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  docker:
    # The production stack exactly as deployed: real Dockerfiles, compose.yaml, Caddy with HTTPS
    # (local certificates for *.localhost), separate worker, the web profile, then deploy/smoke-test.sh.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test configuration
        run: |
          cat > .env <<'ENV'
          APP_DOMAIN=app.localhost
          API_DOMAIN=api.localhost
          ACME_EMAIL=ci@example.org
          CADDY_GLOBAL=local_certs
          CADDY_SITES=all
          COMPOSE_PROFILES=web
          ENV
      - run: docker compose build
      - run: docker compose up -d
      - run: deploy/smoke-test.sh
      - if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
