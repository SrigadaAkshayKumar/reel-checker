name: deploy
# Manual: Actions → deploy → Run workflow. Pulls main on the VM, rebuilds, restarts, smoke-tests.
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         VM address
#   DEPLOY_USER         SSH user (ubuntu on Oracle's Ubuntu images)
#   DEPLOY_SSH_KEY      private key whose public half is in ~/.ssh/authorized_keys on the VM
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <VM address>` (pins the server's identity)
on:
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull, rebuild, restart, smoke-test
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -se <<'REMOTE'
          set -euo pipefail
          cd ~/reel-checker
          git fetch --quiet origin main
          git merge --ff-only origin/main
          docker compose up -d --build --remove-orphans
          docker image prune -f >/dev/null
          set -a; . ./.env; set +a
          deploy/smoke-test.sh "$API_DOMAIN" "$APP_DOMAIN"
          REMOTE
